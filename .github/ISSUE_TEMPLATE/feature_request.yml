name: Feature request
description: Suggest an idea for vromvrom-engine
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please check that a similar request does not already exist before submitting.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this feature solve? What is the use case?
      placeholder: "e.g. I would like to route tasks to provider X, but ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the feature work? Be as concrete as possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround or alternative approach you have tried or considered.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — links, references, mockups...
